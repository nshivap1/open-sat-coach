In the system of equations above, k is a constant. For what value of k does the system have no solution?`,choices:["\u221212","4","12","24"],answer:"C",sum:"k = 12, which makes the lines parallel (same slope) with different intercepts.",steps:["No solution means parallel lines: the coefficients are proportional but the constants are not.","The y-coefficients give the ratio: \u22128 \xF7 (\u22122) = 4","So k = 3 \xB7 4 = 12","Constants: 7 \xB7 4 = 28 \u2260 20, so the lines are distinct."],check:"Slopes: 3x \u2212 2y = 7 \u2192 y = 1.5x \u2212 3.5; 12x \u2212 8y = 20 \u2192 y = 1.5x \u2212 2.5. Same slope, different intercepts, so no intersection.",why:{A:"A sign error in the ratio (\u22128 \xF7 2 = \u22124) gives k = \u221212; those lines are not parallel.",B:"4 is the scale factor between the equations, not the value of k.",D:"Multiplying 3 by 8 instead of by the scale factor 4 gives 24."},take:"For no solution, scale one equation to match the other's x- and y-coefficients, then confirm the constants differ.",hints:["This tests the number of solutions of a linear system.","Parallel lines have proportional x- and y-coefficients.","Find what the second equation's y-coefficient is multiplied by relative to the first."]},{n:"math.alg.ineq.001",type:"solve",d:"easy",prompt:`\u22123x + 7 > 19

Which of the following describes all solutions to the inequality above?`,choices:["x > \u22124","x < \u22124","x > 4","x < 4"],answer:"B",sum:"x < \u22124: subtract 7, then divide by \u22123 and flip the inequality sign.",steps:["Subtract 7: \u22123x > 12","Divide by \u22123 and reverse the sign: x < \u22124"],check:"Test x = \u22125: \u22123(\u22125) + 7 = 22 > 19 \u2713. Test x = 0: 7 > 19 is false \u2713, so values above \u22124 are excluded.",why:{A:"Forgets to reverse the inequality when dividing by a negative number.",C:"Drops the negative sign of the quotient (12 \xF7 \u22123 = \u22124) and also does not flip the sign.",D:"Drops the negative sign of the quotient, though it does flip the inequality."},take:"Multiplying or dividing an inequality by a negative number reverses its direction.",hints:["This tests solving a linear inequality.","Isolate the x-term first, then divide.","After subtracting 7 you have \u22123x > 12. What happens when you divide by a negative?"]},{n:"math.alg.ineq.002",type:"context",d:"medium",ctx:!0,prompt:"A delivery van can safely carry at most 1,200 pounds. The driver weighs 180 pounds, and each box weighs 45 pounds. What is the greatest number of boxes the van can carry with the driver?",accepted:["22"],sum:"22 boxes: 180 + 45b \u2264 1,200 gives b \u2264 22.67, and b must be a whole number.",steps:["Inequality: 180 + 45b \u2264 1200","Subtract 180: 45b \u2264 1020","Divide: b \u2264 22.67","The number of boxes is a whole number, so b = 22"],check:"22 boxes: 180 + 990 = 1,170 \u2264 1,200 \u2713. 23 boxes: 180 + 1,035 = 1,215 > 1,200 \u2717.",take:'When an inequality counts whole objects, round to the nearest whole number that still satisfies it; for "at most," round down.',hints:["This tests writing and solving an inequality from a context.","Write an expression for the total weight with b boxes.","The total weight is 180 + 45b, which must be at most 1,200."]},{n:"math.adv.equiv.001",type:"expand_factor",d:"medium",prompt:"Which expression is equivalent to (2x \u2212 3)\xB2 \u2212 (x + 1)(x \u2212 1)?",choices:["3x\xB2 + 10","5x\xB2 \u2212 12x + 8","3x\xB2 \u2212 12x + 8","3x\xB2 \u2212 12x + 10"],answer:"D",sum:"3x\xB2 \u2212 12x + 10: expand both products, then subtract the whole second product.",steps:["(2x \u2212 3)\xB2 = 4x\xB2 \u2212 12x + 9","(x + 1)(x \u2212 1) = x\xB2 \u2212 1","Subtract: 4x\xB2 \u2212 12x + 9 \u2212 (x\xB2 \u2212 1) = 4x\xB2 \u2212 12x + 9 \u2212 x\xB2 + 1","Combine: 3x\xB2 \u2212 12x + 10"],check:"At x = 2: original (1)\xB2 \u2212 (3)(1) = \u22122; 3(4) \u2212 24 + 10 = \u22122 \u2713. At x = 0: 9 \u2212 (\u22121) = 10 \u2713. (Two checks support the algebra; the expansion proves it.)",why:{A:"Squares as 4x\xB2 + 9, dropping the middle term \u221212x.",B:"Adds the second product instead of subtracting it.",C:"Subtracts x\xB2 but not the \u22121: forgets that \u2212(\u22121) = +1."},take:"(a \u2212 b)\xB2 has a middle term \u22122ab, and a minus sign in front of parentheses changes the sign of every term inside.",hints:["This tests expanding and combining polynomial expressions.","Expand (2x \u2212 3)\xB2 and (x + 1)(x \u2212 1) separately.","The second product is x\xB2 \u2212 1; put it in parentheses before subtracting."]},{n:"math.adv.equiv.002",type:"exponents_radicals",d:"hard",prompt:"For x > 0, which expression is equivalent to (x\u2075 \xB7 \u221Ax) / x\xB2 ?",choices:["x^(1/2)","x^(11/4)","x\xB3","x^(7/2)"],answer:"D",sum:"x^(7/2): \u221Ax = x^(1/2), so the exponent is 5 + 1/2 \u2212 2 = 7/2.",steps:["Write \u221Ax as x^(1/2)","Multiply by adding exponents: x\u2075 \xB7 x^(1/2) = x^(11/2)","Divide by subtracting exponents: x^(11/2 \u2212 2) = x^(7/2)"],check:"At x = 4: (1024 \xB7 2)/16 = 128, and 4^(7/2) = (\u221A4)\u2077 = 2\u2077 = 128 \u2713.",why:{A:"Multiplies exponents (5 \xB7 1/2) instead of adding them, then subtracts 2.",B:"Divides the exponent 11/2 by 2 instead of subtracting 2.",C:"Divides 5 by 2 instead of subtracting, then adds 1/2: 5/2 + 1/2 = 3."},take:"Same base: multiply \u2192 add exponents, divide \u2192 subtract exponents, and \u221Ax = x^(1/2).",hints:["This tests exponent rules with radicals.","Rewrite the square root as a fractional exponent.","The numerator is x^(5 + 1/2)."]},{n:"math.adv.nleq.001",type:"quadratic",d:"medium",prompt:`2x\xB2 \u2212 10x \u2212 28 = 0

What is the sum of the solutions to the equation above?`,accepted:["5"],sum:"5: dividing by 2 gives x\xB2 \u2212 5x \u2212 14 = 0, which factors as (x \u2212 7)(x + 2) = 0, so the solutions 7 and \u22122 sum to 5.",steps:["Divide every term by 2: x\xB2 \u2212 5x \u2212 14 = 0","Factor: (x \u2212 7)(x + 2) = 0","Solutions: x = 7 and x = \u22122","Sum: 7 + (\u22122) = 5"],check:"x = 7: 98 \u2212 70 \u2212 28 = 0 \u2713. x = \u22122: 8 + 20 \u2212 28 = 0 \u2713. Also \u2212b/a = 10/2 = 5 \u2713.",take:"For ax\xB2 + bx + c = 0, the solutions add to \u2212b/a; factoring is a good way to confirm.",hints:["This tests solving a quadratic equation.","Divide out the common factor of 2 first.","Look for two numbers that multiply to \u221214 and add to \u22125."]},{n:"math.adv.nleq.002",type:"system",d:"hard",prompt:`y = x\xB2 \u2212 4x + 7
y = 2x \u2212 2

The system of equations above has exactly one solution, (a, b). What is the value of b?`,choices:["3","4","7","9"],answer:"B",sum:"b = 4: setting the expressions equal gives (x \u2212 3)\xB2 = 0, so a = 3 and b = 2(3) \u2212 2 = 4.",steps:["Set equal: x\xB2 \u2212 4x + 7 = 2x \u2212 2","Rearrange: x\xB2 \u2212 6x + 9 = 0","Factor: (x \u2212 3)\xB2 = 0, so a = 3","b = 2(3) \u2212 2 = 4"],check:"Parabola at x = 3: 9 \u2212 12 + 7 = 4 \u2713. Line at x = 3: 6 \u2212 2 = 4 \u2713.",why:{A:"3 is the x-coordinate a, not the y-coordinate b.",C:"7 is the parabola's y-intercept (its value at x = 0), not at the intersection.",D:"9 is the constant term of x\xB2 \u2212 6x + 9, not a coordinate."},take:"After solving for x in a system, substitute back to get y, and check which coordinate the question asks for.",hints:["This tests solving a system with a quadratic and a line.","Set the two expressions for y equal to each other.","You should get x\xB2 \u2212 6x + 9 = 0."]},{n:"math.adv.nlfn.001",type:"quadratic_fn",d:"medium",prompt:"The function f is defined by f(x) = \u22122(x \u2212 3)\xB2 + 5. Which statement about f is true?",choices:["f has a maximum value of 5 at x = 3.","f has a minimum value of 5 at x = 3.","f has a maximum value of 5 at x = \u22123.","f has a maximum value of 3 at x = 5."],answer:"A",sum:"In vertex form a(x \u2212 h)\xB2 + k, the vertex is (3, 5), and a = \u22122 < 0 makes it a maximum.",steps:["Vertex form a(x \u2212 h)\xB2 + k has vertex (h, k) = (3, 5)","a = \u22122 is negative, so the parabola opens downward","So the vertex is a maximum: f(3) = 5"],check:"f(3) = 5, while f(2) = \u22122(1) + 5 = 3 and f(4) = 3, both smaller, so 5 is a maximum \u2713.",why:{B:"Ignores the negative leading coefficient; a downward parabola has a maximum, not a minimum.",C:"Reads (x \u2212 3) as x = \u22123; the vertex is at x = +3.",D:"Swaps h and k in the vertex."},take:"In f(x) = a(x \u2212 h)\xB2 + k, the vertex is (h, k): note the sign flip on h, and use the sign of a for max vs. min.",hints:["This tests reading the vertex form of a quadratic.","Identify h, k, and the sign of a.","The vertex is at x = h, where (x \u2212 h) = 0."]},{n:"math.adv.nlfn.002",type:"exponential",d:"hard",ctx:!0,prompt:"A lab culture starts with 400 bacteria, and the population triples every 5 hours. Which expression gives the population m minutes after the start?",choices:["400 \xB7 3^(12m)","400 \xB7 3^(m/12)","400 \xB7 3^(m/5)","400 \xB7 3^(m/300)"],answer:"D",sum:"400 \xB7 3^(m/300): one tripling period is 5 hours = 300 minutes, so the number of triplings is m/300.",steps:["In hours t: P = 400 \xB7 3^(t/5)","Convert: t = m/60 hours","Exponent: (m/60)/5 = m/300","P = 400 \xB7 3^(m/300)"],check:"At m = 300 (5 hours): 400 \xB7 3\xB9 = 1,200, exactly one tripling \u2713. At m = 0: 400 \u2713.",why:{A:"Converts in the wrong direction (multiplies by 60 and divides by 5), giving 12m.",B:"Divides 60 by 5 to get 12, mixing up the units in the exponent.",C:"Uses minutes in a formula built for hours; it triples every 5 minutes."},take:"In a\xB7b^(t/k), k is the time for one growth period, written in the same units as t.",hints:["This tests building an exponential model with unit conversion.","First write the model in hours, then rewrite hours in terms of minutes.","How many minutes is one tripling period?"]},{n:"math.psda.ratios.001",type:"proportion",d:"easy",ctx:!0,prompt:"A pancake recipe uses 3 cups of flour for every 2 cups of milk. At this rate, how many cups of flour are needed for 7 cups of milk?",choices:["4.2","14/3","8","10.5"],answer:"D",sum:"10.5 cups: flour/milk = 3/2, so flour = (3/2)(7) = 10.5.",steps:["Set up a proportion: 3/2 = f/7","Cross-multiply: 2f = 21","f = 10.5"],check:"Ratio check: 10.5/7 = 1.5 = 3/2 \u2713. More milk than 2 cups should need more than 3 cups of flour \u2713.",why:{A:"Uses the part-to-whole fraction 3/5 of 7 instead of the flour-to-milk ratio.",B:"Inverts the ratio, computing (2/3)(7).",C:"Adds instead of scaling: milk went up by 5, so it adds 5 to the flour."},take:"Keep the same quantity on top on both sides of a proportion, and scale by multiplying, not adding.",hints:["This tests proportional reasoning.","Write flour/milk on both sides of an equation.","3/2 = f/7."]},{n:"math.psda.ratios.002",type:"units",d:"medium",ctx:!0,prompt:"A car travels at a constant speed of 72 kilometers per hour. What is this speed in meters per second? (1 kilometer = 1,000 meters)",choices:["1.2","20","259.2","1,200"],answer:"B",sum:"20 m/s: 72 km/h \xD7 1,000 m/km \xF7 3,600 s/h = 20 m/s.",steps:["72 km/h \xD7 1,000 m/km = 72,000 m/h","1 hour = 60 \xD7 60 = 3,600 seconds","72,000 \xF7 3,600 = 20 m/s"],check:"Units cancel: (km/h)(m/km)(h/s) = m/s \u2713. Reverse: 20 m/s \xD7 3,600 = 72,000 m/h = 72 km/h \u2713.",why:{A:"Divides 72 by 60 only (km per minute) and never converts kilometers to meters.",C:"Multiplies by 3.6 instead of dividing; that converts m/s to km/h.",D:"Converts hours only to minutes (\xF7 60), not to seconds."},take:"Write conversion factors as fractions and check that the unwanted units cancel.",hints:["This tests converting a rate between units.","Convert kilometers to meters, then hours to seconds.","One hour has 3,600 seconds."]},{n:"math.psda.percent.001",type:"percent_change",d:"medium",ctx:!0,prompt:"The price of a jacket was increased by 20%. Later, the new price was decreased by 20%. The final price was $96. What was the original price, in dollars?",choices:["96","100","115.20","120"],answer:"B",sum:"$100: the two changes multiply to 1.2 \xD7 0.8 = 0.96, so 0.96P = 96.",steps:["After +20%: 1.20P","After \u221220%: 0.80(1.20P) = 0.96P","0.96P = 96, so P = 100"],check:"$100 \xD7 1.2 = $120; $120 \xD7 0.8 = $96 \u2713.",why:{A:"Assumes a 20% increase and a 20% decrease cancel out.",C:"Applies a 20% increase to $96 instead of undoing both changes.",D:"Undoes only the 20% decrease (96 \xF7 0.8) and forgets the increase."},take:"Successive percent changes multiply; a percent increase followed by the same percent decrease gives a net decrease.",hints:["This tests successive percent changes.","Write each change as a multiplier on the original price P.","The multipliers are 1.20 and 0.80."]},{n:"math.psda.percent.002",type:"percent_of",d:"hard",ctx:!0,prompt:"At a high school, 40% of the students are in the band. Of the students in the band, 25% are also in the choir. If 36 students are in both the band and the choir, how many students attend the school?",accepted:["360"],sum:"360: students in both = 0.25 \xD7 0.40 \xD7 N = 0.10N, and 0.10N = 36.",steps:["Band: 0.40N","Band and choir: 0.25 \xD7 0.40N = 0.10N","0.10N = 36, so N = 360"],check:"40% of 360 = 144 band students; 25% of 144 = 36 \u2713.",take:'A "percent of a percent" multiplies: 25% of 40% is 10% of the whole.',hints:["This tests finding a whole from nested percents.","Write the number of band students in terms of N first.","Students in both = 0.25 \xD7 (0.40N)."]},{n:"math.psda.onevar.001",type:"center",d:"medium",prompt:"The frequency table shows the number of books each of 20 students read over the summer. What is the median number of books read?",table:{headers:["Books read","Number of students"],rows:[["0","3"],["1","5"],["2","6"],["3","4"],["4","2"]]},choices:["1.85","2","4","6"],answer:"B",sum:"The median is 2: with 20 values, it is the average of the 10th and 11th values, and both are 2.",steps:["Total students: 3 + 5 + 6 + 4 + 2 = 20, so the median is the mean of the 10th and 11th values","Cumulative counts: 0 books \u2192 3, 1 book \u2192 8, 2 books \u2192 14","Values 9 through 14 are all 2, so the 10th and 11th values are both 2","Median = 2"],check:"8 students read fewer than 2 books and 6 read more than 2, so 2 sits in the middle of the ordered list \u2713.",why:{A:"1.85 is the mean (37 \xF7 20), not the median.",C:"4 is the median of the frequency column (2, 3, 4, 5, 6), not of the data values.",D:"6 is the largest frequency (how many students read 2 books), not a number of books."},take:"In a frequency table, the data values are in the first column; the frequencies only tell how many times each value appears.",hints:["This tests finding the median from a frequency table.","Count the total number of students to find which positions are in the middle.","Add up frequencies until you reach the 10th and 11th students."]},{n:"math.psda.onevar.002",type:"spread",d:"hard",prompt:`A data set consists of these seven values:

12, 15, 15, 18, 20, 22, 60

If the value 60 is removed from the data set, which statement describes the effect on the mean, the median, and the standard deviation?`,choices:["All three decrease.","The mean and standard deviation decrease; the median stays the same.","The mean and median decrease; the standard deviation increases.","The median and standard deviation decrease; the mean stays the same."],answer:"A",sum:"All three decrease: the mean drops from about 23.1 to 17, the median from 18 to 16.5, and the spread shrinks a lot without the outlier.",steps:["Mean before: 162 \xF7 7 \u2248 23.1; after: 102 \xF7 6 = 17","Median before: 4th value = 18; after: (15 + 18) \xF7 2 = 16.5","Removing a value far from the rest reduces the typical distance from the mean, so the standard deviation decreases (about 15.4 \u2192 3.4)."],check:"Range also confirms the spread change: 60 \u2212 12 = 48 before, 22 \u2212 12 = 10 after.",why:{B:"Assumes the median cannot change, but removing any value shifts which value is in the middle.",C:"Removing an outlier makes the data less spread out, not more.",D:"The mean is very sensitive to outliers; removing 60 lowers it a lot."},take:"An outlier pulls the mean and inflates the standard deviation; the median is resistant but can still shift slightly when a value is removed.",hints:["This tests how an outlier affects center and spread.","Compute the mean and median with and without 60.","With six values left, the median is the average of the 3rd and 4th values."]},{n:"math.psda.twovar.001",type:"best_fit",d:"medium",ctx:!0,prompt:"A scatterplot shows the number of hours, x, that each of 12 students studied and each student's test score, y. The points show a positive linear association, and the line of best fit is \u0177 = 2.4x + 31. One student studied 10 hours and scored 61. What is this student's actual score minus the score predicted by the line of best fit?",accepted:["6"],sum:"6: the line predicts 2.4(10) + 31 = 55, and 61 \u2212 55 = 6.",steps:["Predicted score: \u0177 = 2.4(10) + 31 = 24 + 31 = 55","Actual minus predicted: 61 \u2212 55 = 6"],check:"The point (10, 61) is above the line, so the residual should be positive \u2713.",take:"Residual = actual \u2212 predicted; a positive residual means the point lies above the line.",hints:["This tests using a line of best fit to make a prediction.","Substitute x = 10 into the equation of the line.","The predicted score is 2.4(10) + 31."]},{n:"math.psda.twovar.002",type:"model_type",d:"medium",prompt:"The table shows values of x and y. Which equation models the relationship exactly?",table:{headers:["x","0","1","2","3","4"],rows:[["y","5","10","20","40","80"]]},choices:["y = 5(2)\u02E3","y = 5 + 5x","y = 5x\xB2 + 5","y = 80(1/2)\u02E3"],answer:"A",sum:"y = 5(2)\u02E3: each time x increases by 1, y doubles, which is exponential growth starting at 5.",steps:["Differences 5, 10, 20, 40 are not constant, so the model is not linear","Ratios 10/5 = 20/10 = 40/20 = 80/40 = 2 are constant, so it is exponential","Initial value at x = 0 is 5: y = 5(2)\u02E3"],check:"x = 3: 5 \xB7 8 = 40 \u2713. x = 4: 5 \xB7 16 = 80 \u2713.",why:{B:"Uses only the first difference (5); it gives y = 15 at x = 2, not 20.",C:"Fits the first two points but gives y = 25 at x = 2, not 20.",D:"Reads the table backward; this decays from 80 and gives y = 80 at x = 0."},take:"Constant differences \u2192 linear; constant ratios \u2192 exponential. Check every row, not just the first two.",hints:["This tests identifying linear vs. exponential relationships.","Compare consecutive y-values by subtracting and by dividing.","What do you multiply each y-value by to get the next one?"]},{n:"math.psda.prob.001",type:"basic",d:"easy",prompt:"A bag contains 4 red marbles, 6 blue marbles, and 5 green marbles. One marble is chosen at random. What is the probability that the marble is not blue?",choices:["4/15","2/5","3/5","2/3"],answer:"C",sum:"3/5: 9 of the 15 marbles are not blue, and 9/15 = 3/5.",steps:["Total marbles: 4 + 6 + 5 = 15","Not blue: 4 + 5 = 9","P(not blue) = 9/15 = 3/5"],check:"P(blue) + P(not blue) = 6/15 + 9/15 = 1 \u2713.",why:{A:'Counts only red marbles as "not blue."',B:"2/5 = 6/15 is the probability that the marble IS blue.",D:"6/9 compares blue to non-blue marbles; a probability must divide by the total, 15."},take:"Probability = favorable outcomes \xF7 total outcomes, and P(not A) = 1 \u2212 P(A).",hints:["This tests basic probability.","Find the total number of marbles and the number that are not blue.","There are 15 marbles in all."]},{n:"math.psda.prob.002",type:"conditional",d:"hard",prompt:"The two-way table summarizes a survey of 200 students about whether they prefer online or in-person classes. If a student who prefers online classes is selected at random, what is the probability that the student is in grade 11?",table:{headers:["","Online","In person","Total"],rows:[["Grade 10","36","54","90"],["Grade 11","66","44","110"],["Total","102","98","200"]]},accepted:["11/17",".6470",".6471","0.647"],sum:"11/17: of the 102 students who prefer online, 66 are in grade 11, and 66/102 = 11/17.",steps:['The condition "prefers online" limits the group to the Online column: 102 students',"Grade 11 within that column: 66","P = 66/102 = 11/17 \u2248 0.647"],check:"Column check: 36 + 66 = 102 \u2713. The answer is between 0 and 1 and above 1/2, matching that most online-preferring students are in grade 11 \u2713.",take:'For "given" or "selected from those who\u2026" questions, the denominator is the total of the condition group, not the grand total.',hints:["This tests conditional probability from a two-way table.","Identify which group the student is chosen from; that total is your denominator.","Use only the Online column."]},{n:"math.psda.inference.001",type:"margin",d:"medium",ctx:!0,prompt:"A random sample of 500 voters in a city was surveyed. Of those surveyed, 54% said they support a new park proposal. The margin of error for this estimate is 4 percentage points. Which conclusion is most appropriate?",choices:["It is plausible that between 50% and 58% of all voters in the city support the proposal.","Exactly 54% of all voters in the city support the proposal.","Between 50% and 58% of the 500 surveyed voters support the proposal.","The proposal will certainly be supported by a majority of the city's voters."],answer:"A",sum:"The margin of error gives a plausible range for the whole population: 54% \xB1 4% = 50% to 58%.",steps:["Sample estimate: 54%","Interval: 54 \u2212 4 = 50 to 54 + 4 = 58 percent","This interval estimates the support among all city voters, the population sampled."],check:`The interval's lower end is 50%, so a majority is plausible but not guaranteed, which rules out "certainly."`,why:{B:"A sample estimate is not exact for the population; the margin of error shows the uncertainty.",C:"The sample percent is known exactly (54%); the interval describes the population, not the sample.",D:"The plausible range reaches 50%, so a majority is not certain."},take:"A margin of error describes the population value, not the sample, and it never makes a conclusion certain.",hints:["This tests interpreting a margin of error.","Add and subtract 4 from the sample percent.","Ask whether the interval describes the 500 surveyed voters or all voters."]},{n:"math.psda.inference.002",type:"generalize",d:"medium",ctx:!0,prompt:"A researcher randomly selected 300 people from the membership list of Peak Fitness, a gym in one city, and asked how many hours they exercise per week. The mean was 5.2 hours. To which group can the researcher most appropriately generalize this result?",choices:["All adults in the city","All gym members in the country","All members of Peak Fitness","Only the 300 people surveyed"],answer:"C",sum:"The sample was randomly drawn from Peak Fitness members, so it represents that population.",steps:["Identify the population that was randomly sampled: Peak Fitness members","Random selection makes the sample representative of that population","Generalize only to Peak Fitness members"],check:"Every Peak Fitness member had a chance to be selected; no adult outside the gym did, so the result cannot reach beyond the gym.",why:{A:"Gym members likely exercise more than typical adults; non-members were never sampled.",B:"Only one gym was sampled; other gyms' members had no chance to be selected.",D:"Too narrow: random sampling is exactly what allows generalizing to the population sampled."},take:"A random sample supports conclusions about the population it was drawn from, and no larger group.",hints:["This tests generalizing from a sample.","Find the list the 300 people were randomly chosen from.","Who had a chance to be in the sample?"]},{n:"math.psda.claims.001",type:"design",d:"medium",ctx:!0,prompt:"Researchers recruited 120 volunteers and randomly assigned half to use a new sleep app for a month and half to use no app. The app group averaged significantly more sleep per night. Which conclusion is best supported?",choices:["The app causes more sleep for adults in general.","The app likely causes more sleep for people similar to these volunteers.","No conclusion about cause is possible because the volunteers were not a random sample.","The study shows only an association because it is observational."],answer:"B",sum:"Random assignment supports a cause-and-effect conclusion, but volunteers are not a random sample, so it applies to people like them.",steps:["Random assignment to groups \u2192 a causal conclusion is reasonable","Volunteers, not a random sample of a population \u2192 generalize only to similar people","So: the app likely causes more sleep for people like the volunteers"],check:"Two questions: Was there random assignment? Yes (cause OK). Was there random sampling? No (no broad generalization).",why:{A:"Generalizes too far; volunteers were not randomly sampled from all adults.",C:"Confuses random sampling with random assignment; random assignment is what supports causation.",D:"Researchers assigned the treatment, so this is an experiment, not an observational study."},take:"Random assignment \u2192 cause; random sampling \u2192 generalize. Check each separately.",hints:["This tests what conclusions a study design supports.","Ask whether there was random assignment and whether there was random sampling.","Random assignment was used, but the participants were volunteers."]},{n:"math.psda.claims.002",type:"design",d:"hard",ctx:!0,prompt:"A survey of 2,000 randomly selected adults in a country found that adults who drink more coffee report fewer headaches, on average. Which conclusion is appropriate?",choices:["Drinking more coffee causes adults in the country to have fewer headaches.","The result applies only to the 2,000 adults surveyed.","No conclusion about the country's adults is possible because 2,000 is too small a sample.","There is an association between coffee and fewer headaches among adults in the country, but cause is not shown."],answer:"D",sum:"Random sampling lets the association generalize to the country's adults, but with no random assignment it does not show cause.",steps:["Random sample from the country \u2192 generalize to adults in the country","Observational (people chose how much coffee to drink) \u2192 association only","Conclusion: an association among the country's adults, cause not established"],check:"Other factors (like sleep or stress) could affect both coffee drinking and headaches, so causation cannot be claimed without an experiment.",why:{A:"Claims cause from an observational study with no random assignment.",B:"Too narrow; the random sample supports generalizing to the population of adults in the country.",C:"A random sample of 2,000 is large enough to describe a population; sample size is not the issue."},take:"Observational data can show an association in the sampled population but cannot establish cause.",hints:["This tests drawing conclusions from an observational study.","Check for random sampling and for random assignment.","The adults chose their own coffee habits; nobody assigned them."]},{n:"math.geo.area.001",type:"area",d:"medium",prompt:"The length of a rectangle is 3 times its width. The perimeter of the rectangle is 64 centimeters. What is the area of the rectangle, in square centimeters?",choices:["24","192","256","768"],answer:"B",sum:"192 cm\xB2: the perimeter is 2(3w + w) = 8w = 64, so w = 8, \u2113 = 24, and area = 8 \xB7 24.",steps:["Let width = w and length = 3w","Perimeter: 2(3w + w) = 8w = 64, so w = 8","Length = 24","Area = 24 \xB7 8 = 192"],check:"Perimeter: 2(24 + 8) = 64 \u2713. Length is 3 \xD7 width: 24 = 3 \xB7 8 \u2713.",why:{A:"24 is the length, not the area.",C:"Treats the rectangle as a square with side 64 \xF7 4 = 16.",D:"Uses \u2113 + w = 64 (half the perimeter forgotten), giving w = 16 and \u2113 = 48."},take:"Perimeter counts each side twice: P = 2(\u2113 + w). Answer with the quantity asked for: area, not a side.",hints:["This tests perimeter and area of a rectangle.","Write the length and width in terms of one variable.","The perimeter is 2(3w + w)."]},{n:"math.geo.area.002",type:"volume",d:"hard",ctx:!0,prompt:"A rectangular box with inside dimensions 10 centimeters by 8 centimeters by 9 centimeters is completely filled with water. All of the water is poured into an empty right circular cylinder with an inside radius of 4 centimeters. What is the height of the water in the cylinder, in centimeters, rounded to the nearest tenth?",accepted:["14.3"],sum:"14.3 cm: the water volume is 720 cm\xB3, and \u03C0(4\xB2)h = 720 gives h = 45/\u03C0 \u2248 14.3.",steps:["Box volume: 10 \xB7 8 \xB7 9 = 720 cm\xB3","Cylinder volume: \u03C0r\xB2h = 16\u03C0h","16\u03C0h = 720, so h = 45/\u03C0 \u2248 14.32","Rounded to the nearest tenth: 14.3"],check:"\u03C0 \xB7 16 \xB7 14.3 \u2248 718.8 cm\xB3, close to 720 (difference from rounding) \u2713. Units: cm\xB3 \xF7 cm\xB2 = cm \u2713.",take:"When liquid moves between containers, the volume stays the same; set the two volume formulas equal.",hints:["This tests volume of a box and a cylinder.","Find the volume of water first; it does not change when poured.","Set 16\u03C0h equal to the box's volume."]},{n:"math.geo.lines.001",type:"angles",d:"medium",prompt:"Lines p and q are parallel, and both are crossed by line t. Two angles lie on the same side of line t and both lie between lines p and q (same-side interior angles). Their measures are (3x + 15)\xB0 and (2x + 5)\xB0. What is the measure, in degrees, of the larger angle?",choices:["32","69","111","135"],answer:"C",sum:"111\xB0: same-side interior angles are supplementary, so 5x + 20 = 180, x = 32, and 3(32) + 15 = 111.",steps:["Same-side interior angles add to 180\xB0: (3x + 15) + (2x + 5) = 180","5x + 20 = 180, so x = 32","Angles: 3(32) + 15 = 111\xB0 and 2(32) + 5 = 69\xB0","The larger angle is 111\xB0"],check:"111 + 69 = 180 \u2713.",why:{A:"32 is the value of x, not an angle measure.",B:"69\xB0 is the smaller angle.",D:"Adds 20 instead of subtracting it (5x = 200, x = 40), giving 3(40) + 15 = 135."},take:"With parallel lines, same-side interior angles are supplementary; alternate interior angles are equal.",hints:["This tests angle relationships with parallel lines.","Decide whether these angles are equal or supplementary.","Same-side interior angles add to 180\xB0."]},{n:"math.geo.lines.002",type:"similar",d:"medium",prompt:"In triangle ABC, point D lies on side AB and point E lies on side AC so that segment DE is parallel to side BC. If AD = 6, DB = 4, and DE = 9, what is the length of BC?",accepted:["15"],sum:"BC = 15: triangle ADE is similar to triangle ABC with ratio AD/AB = 6/10, so 9/BC = 6/10.",steps:["DE \u2225 BC, so triangle ADE ~ triangle ABC (AA similarity)","AB = AD + DB = 6 + 4 = 10","AD/AB = DE/BC: 6/10 = 9/BC","BC = 90/6 = 15"],check:"Ratio check: 9/15 = 0.6 = 6/10 \u2713. BC is longer than DE, as it should be for the larger triangle \u2713.",take:"In similar triangles, compare matching sides of the whole triangles: use AB = AD + DB, not DB.",hints:["This tests similar triangles formed by a parallel segment.","Name the two similar triangles and match corresponding sides.","The full side AB is 6 + 4 = 10."]},{n:"math.geo.trig.001",type:"trig_ratios",d:"medium",prompt:"In right triangle PQR, angle R is the right angle and sin P = 5/13. What is the value of tan Q?",choices:["5/12","12/13","13/12","12/5"],answer:"D",sum:"tan Q = 12/5: with QR = 5 and PQ = 13, PR = 12, and tan Q = PR/QR.",steps:["sin P = opposite/hypotenuse = QR/PQ, so take QR = 5 and PQ = 13","Pythagorean theorem: PR = \u221A(13\xB2 \u2212 5\xB2) = \u221A144 = 12","For angle Q: opposite side is PR = 12, adjacent side is QR = 5","tan Q = 12/5"],check:"tan P \xB7 tan Q = (5/12)(12/5) = 1, as expected for the two acute angles of a right triangle \u2713.",why:{A:"5/12 is tan P; it uses angle P's opposite and adjacent sides.",B:"12/13 is cos P (= sin Q), not tan Q.",C:"13/12 is hypotenuse \xF7 adjacent for angle P, which is not a tangent."},take:"Label opposite and adjacent from the angle you are asked about; the two acute angles swap them.",hints:["This tests trig ratios in a right triangle.","Use sin P to label two sides, then find the third with the Pythagorean theorem.","The missing side is \u221A(169 \u2212 25)."]},{n:"math.geo.trig.002",type:"pythagorean",d:"hard",ctx:!0,prompt:"A 25-foot ladder leans against a vertical wall on level ground. The bottom of the ladder is 7 feet from the base of the wall. The top of the ladder then slides 4 feet down the wall, and the ladder stays straight against the wall. How many feet farther from the wall is the bottom of the ladder now?",accepted:["8"],sum:"8 feet: the top starts at 24 ft high and drops to 20 ft, so the bottom moves from 7 ft to 15 ft.",steps:["Initial height: \u221A(25\xB2 \u2212 7\xB2) = \u221A576 = 24 ft","New height: 24 \u2212 4 = 20 ft","New distance: \u221A(25\xB2 \u2212 20\xB2) = \u221A225 = 15 ft","Change: 15 \u2212 7 = 8 ft"],check:"15\xB2 + 20\xB2 = 225 + 400 = 625 = 25\xB2 \u2713, and 7\xB2 + 24\xB2 = 49 + 576 = 625 \u2713.",take:"The ladder (hypotenuse) stays the same; recompute the legs with the Pythagorean theorem instead of assuming they change equally.",hints:["This tests the Pythagorean theorem in context.","Find how high the ladder reaches before it slides.","Before sliding, the top is \u221A(625 \u2212 49) feet high."]},{n:"math.geo.circles.001",type:"equation",d:"hard",prompt:`x\xB2 + y\xB2 \u2212 6x + 10y \u2212 2 = 0

The equation above defines a circle in the xy-plane. What are the center and radius of the circle?`,choices:["Center (\u22123, 5), radius 6","Center (3, \u22125), radius 36","Center (3, \u22125), radius 6","Center (3, \u22125), radius \u221A32"],answer:"C",sum:"Completing the square gives (x \u2212 3)\xB2 + (y + 5)\xB2 = 36, so the center is (3, \u22125) and the radius is 6.",steps:["Group: (x\xB2 \u2212 6x) + (y\xB2 + 10y) = 2","Complete the squares: add 9 and 25 to both sides","(x \u2212 3)\xB2 + (y + 5)\xB2 = 2 + 9 + 25 = 36","Center (3, \u22125), radius \u221A36 = 6"],check:"The point (9, \u22125) is 6 units right of the center: 81 + 25 \u2212 54 \u2212 50 \u2212 2 = 0 \u2713.",why:{A:"Takes the center coordinates with the wrong signs: (x \u2212 3)\xB2 + (y + 5)\xB2 has center (3, \u22125).",B:"36 is r\xB2, not the radius.",D:"Subtracts the 2 instead of moving it to the right side as +2: 9 + 25 \u2212 2 = 32."},take:"Complete the square for x and y, add the same amounts to both sides, then take the square root of the right side for r.",hints:["This tests the equation of a circle.","Move the constant to the right side and complete the square in x and in y.","Half of \u22126 is \u22123 and half of 10 is 5; square those."]},{n:"math.geo.circles.002",type:"arcs_sectors",d:"medium",prompt:"A circle has a radius of 12 inches. A central angle of the circle measures 5\u03C0/6 radians. The length of the arc intercepted by this angle is k\u03C0 inches. What is the value of k?",accepted:["10"],sum:"k = 10: arc length = r\u03B8 = 12 \xB7 5\u03C0/6 = 10\u03C0.",steps:["For an angle in radians, arc length s = r\u03B8","s = 12 \xB7 (5\u03C0/6) = 60\u03C0/6 = 10\u03C0","So k = 10"],check:"Degrees check: 5\u03C0/6 = 150\xB0, and (150/360) \xB7 2\u03C0(12) = (5/12) \xB7 24\u03C0 = 10\u03C0 \u2713.",take:"Arc length is r\u03B8 only when \u03B8 is in radians; in degrees use (\u03B8/360) \xB7 2\u03C0r.",hints:["This tests arc length with a radian angle.","Use the arc-length formula for radians.","Multiply the radius by the angle measure."]}],Hg=o1.map(s1);var $g=[{skillId:"rw.ii.central",title:"Find the main idea and the stated details",objective:"State what a short text is mainly about and locate details it says directly.",cues:['"Which choice best states the main idea"','"According to the text"','A text with a turn word such as "but" or "however"'],steps:["Read the whole text, then sum it up in under ten words before looking at the choices.",'Look for a turn ("But," "However," "Instead"); the idea after the turn is usually the point.',"For detail questions, find the exact sentence and match the choice to it word by word.","Eliminate choices that are true but cover only one sentence, or that add ideas the text never states."],workedExample:{problem:'Text: "Many people think the fictional town of Dunmore was founded by miners. Records from the town church, however, show that farming families lived there twenty years before the mine opened." What is the main idea?',solution:["Summary: records show farmers, not miners, settled Dunmore first.",'The turn word "however" points to the main idea: the common belief is challenged.','A choice like "Church records exist in Dunmore" is true but too narrow.',"Best answer: records suggest Dunmore was settled by farmers before miners arrived."]},trap:"Picking a choice that is true but describes only one detail instead of the whole text.",check:{question:"A choice repeats a fact from the second sentence exactly. Why might it still be wrong for a main idea question?",answer:"It may be accurate but too narrow; the main idea must cover the whole text, not one supporting detail."},minutes:3},{skillId:"rw.ii.evidence",title:"Match the evidence to the exact claim",objective:"Choose the quotation, finding, or data point that directly supports or weakens a specific claim.",cues:['"most directly support" or "would most weaken"','"Which quotation most effectively illustrates"',"A table or graph paired with a claim"],steps:["Restate the claim in your own words, and note every part of it (who, what, compared with what).",'For each choice, ask: if this were true, would the claim be more believable (or less, for "weaken")?',"For tables, first check that the numbers in a choice are accurate, then check that they prove the specific claim.","Eliminate choices that are on topic but do not address the claim's exact point."],workedExample:{problem:"Claim: students at the fictional Lark Academy who take music classes miss fewer school days than students who do not. Which finding supports it? (A) Music classes are popular. (B) Music students averaged 3 absences; other students averaged 7.",solution:["The claim compares two groups (music vs. non-music) on one outcome (absences).","A is on topic but says nothing about absences.","B compares the same two groups on absences and shows the predicted difference.","Answer: B."]},trap:"Choosing a true data point that matches the topic but does not show the specific pattern the claim describes.",check:{question:'A claim says a change happened "sharply after 2010." What must the supporting data compare?',answer:"The amount of change before 2010 with the amount of change after 2010, showing a much bigger change after."},minutes:3},{skillId:"rw.ii.inference",title:"Complete the logic, not a guess",objective:"Finish a text with the conclusion that its own reasoning requires.",cues:["The text ends with a blank",'"Which choice most logically completes the text?"'],steps:["List the facts the text gives, in order.","Ask what must be true if all of those facts are true.","In experiments, focus on the one thing that was different between groups.",'Eliminate choices that need outside information or ignore limiting words like "some," "only," or "most."'],workedExample:{problem:'Text: "Two groups of fictional river snails were kept in identical tanks. One group was given extra calcium. After a month, that group had noticeably thicker shells. This suggests that shell thickness in the snails ______"',solution:["Facts: identical tanks; only calcium differed; shell thickness differed.","So the difference in shells is linked to calcium.",'Best completion: "is influenced, at least in part, by the amount of calcium available."',"A choice about water temperature fails because the tanks were identical."]},trap:"Choosing a conclusion that sounds smart or likely in real life but is not required by the facts in the text.",check:{question:"A text says total sales stayed the same while morning sales fell. What must be true about the rest of the day?",answer:"Sales at other times of day must have risen by about the same amount that morning sales fell."},minutes:3},{skillId:"rw.cs.words",title:"Predict the word from context clues",objective:"Choose the most precise word for a blank, or the meaning of a word as it is used in a text.",cues:["A blank inside a sentence",'"most logical and precise word or phrase"','"As used in the text, what does the word ... most nearly mean?"'],steps:['Cover the choices and find the clues: a definition, an example, or a contrast word ("although," "rather than").',"Predict your own simple word for the blank.","Pick the choice closest to your prediction, even if another choice sounds more impressive.",'For "most nearly means," plug each choice into the sentence and check that it fits what is being described.'],workedExample:{problem:'Text: "The fictional painter Iris Moll worked so ______ that she often finished three canvases in a single afternoon." Choices: meticulously, rapidly, reluctantly, rarely.',solution:['Clue: "finished three canvases in a single afternoon."','Prediction: "fast."','"Rapidly" matches. "Meticulously" means very carefully, which does not explain the speed.',"Answer: rapidly."]},trap:"Picking a word because it is familiar or sounds advanced, without checking it against the clue in the text.",check:{question:'In "His patience wore thin," does "thin" mean narrow or weak?',answer:'Weak. Patience is not a physical object, so "narrow" does not fit; the patience is running out.'},minutes:2},{skillId:"rw.cs.structure",title:"Say what the text does, not just what it says",objective:"Identify the purpose of a text, the role of an underlined sentence, or how a text is organized.",cues:['"main purpose"','"overall structure"','"function of the underlined sentence"'],steps:["Label each sentence with a verb: introduces, claims, gives evidence, contrasts, concludes.",'For purpose, combine the labels into one action ("challenges a belief with evidence").',"For an underlined sentence, compare it with the sentence before and after it.","Eliminate choices that fit only one part of the text or describe something the text never does."],workedExample:{problem:'Text: "Scientists believed the fictional Gray Tern nested only on cliffs. __In 2021, a researcher found a large colony nesting on a sandy beach.__ The finding has led to new surveys of coastal beaches." What does the underlined sentence do?',solution:["Sentence 1: states a belief (cliffs only).","Underlined sentence: reports a beach colony, which goes against that belief.","Sentence 3: describes the result of the finding.","Answer: it presents a finding that contradicts an earlier belief."]},trap:"Choosing a choice that restates the content of the text instead of describing its job, or that fits only one sentence.",check:{question:'A text describes a plan, then explains why it failed. Which describes its structure better: "describes a problem and its solution" or "describes a plan and why it did not work"?',answer:'"Describes a plan and why it did not work," because the text shows the plan failing, not solving a problem.'},minutes:3},{skillId:"rw.cs.crosstext",title:"Compare two texts claim to claim",objective:"Predict how the author of one text would respond to a claim or finding in another.",cues:['"Text 1" and "Text 2"','"How would the author of Text 2 most likely respond"'],steps:["Write one line summarizing the main claim of Text 1.","Write one line summarizing the main claim of Text 2.","Decide the relationship: agree, disagree, or partly agree (accepts the data, questions the conclusion).","Pick the choice that matches that relationship and uses only what the responding text actually says."],workedExample:{problem:`Text 1: "Longer recess does not improve students' math scores." Text 2: "In the fictional Pine Hill schools, longer recess did not change math scores, but students reported fewer conflicts with classmates." How would the author of Text 2 respond to Text 1?`,solution:["Text 1: longer recess does not raise math scores.","Text 2: agrees about math scores but finds a different benefit.","Relationship: partly agrees.","Answer: accept the math finding but argue that longer recess may still have social benefits."]},trap:"Assuming the two authors disagree about everything, or choosing a response that goes further than the text supports.",check:{question:"If Text 2 never mentions how Text 1's data was collected, can Text 2's author be said to reject that data?",answer:"No. Without evidence in Text 2 about the data, the author can only be said to respond to what Text 2 discusses."},minutes:3},{skillId:"rw.eoi.synthesis",title:"Let the goal pick the sentence",objective:"Use bulleted notes to choose the sentence that meets a specific stated goal.",cues:["Bulleted student notes",'"The student wants to emphasize..." or "The student wants to explain..."'],steps:['Read the goal first and underline its key words (for example, "difference," "change," "explanation").',"Turn the goal into a checklist: what must the sentence include?","Test each choice against the checklist only; most choices will be accurate to the notes.","Pick the one choice that meets every part of the goal."],workedExample:{problem:"Notes: the fictional Ridge Trail is 4 miles long; the fictional Creek Trail is 9 miles long; both are in Sable Park. Goal: emphasize a similarity between the trails.",solution:["Checklist: mention both trails; show something they share.",'"Ridge Trail is 4 miles long, while Creek Trail is 9 miles long" shows a difference, so it fails.','"Both Ridge Trail and Creek Trail are located in Sable Park" shows a similarity.',"Answer: the sentence about both trails being in Sable Park."]},trap:"Choosing a sentence that is accurate and well written but does not do what the goal asks.",check:{question:"The goal is to show how an author's style changed. Why is a sentence about only her second book wrong?",answer:"A change requires a comparison of at least two points in time, so both books must be described."},minutes:2},{skillId:"rw.eoi.transitions",title:"Name the relationship, then pick the transition",objective:"Choose the transition word or phrase that matches the logical link between ideas.",cues:["A blank at the start of a sentence followed by a comma","A blank between commas in the middle of a sentence",'"most logical transition"'],steps:["Read the sentence before the blank and the full sentence containing the blank.","Name the relationship: contrast, cause and effect, example, addition, or sequence.","Sort the choices into those same groups and keep only the group that matches.","If the blank is mid-sentence, still compare the whole sentence with the one before it."],workedExample:{problem:'Text: "The fictional Orla River floods almost every spring. ______ farmers along its banks plant their crops in early summer, after the water recedes." Choices: However, / As a result, / For example, / Similarly,',solution:["Sentence 1: the river floods each spring (cause).","Sentence 2: farmers plant after the floods (response).","Relationship: cause and effect.",'Answer: "As a result,".']},trap:"Choosing a transition because it sounds formal, or reacting to a contrast inside the sentence instead of the link between sentences.",check:{question:"Sentence 1 makes a general claim; sentence 2 describes one specific case that fits it. Which kind of transition fits?",answer:'An example transition, such as "for instance" or "for example."'},minutes:2},{skillId:"rw.sec.boundaries",title:"Punctuate by clause, not by pause",objective:"Use periods, semicolons, commas, colons, and dashes correctly between and around groups of words.",cues:["Choices differ only in punctuation","A blank between two groups of words"],steps:["Find each subject and verb. Decide whether the words on each side of the blank could stand alone as a sentence.","Two independent clauses: join with a period, a semicolon, or a comma + and/but/so (FANBOYS). A comma alone is a comma splice.","A colon or dash must follow a complete clause; it introduces an explanation, example, or list.","Nonessential information takes matching punctuation on both sides: two commas, two dashes, or two parentheses.","Never put a single comma or semicolon between a subject and its verb."],workedExample:{problem:'Text: "The fictional Calder Bridge, which opened in 1931 ______ still carries more than 20,000 cars a day." Choices: 1931; / 1931 / 1931, / 1931\u2014',solution:['The nonessential clause "which opened in 1931" starts with a comma after "Bridge."',"It must close with matching punctuation: a comma.",'Check: removing the clause leaves "The fictional Calder Bridge still carries..." which is a complete sentence.','Answer: "1931,".']},trap:"Adding a comma wherever you would pause when speaking; punctuation follows sentence structure, not sound.",check:{question:'Is "The rain stopped, the game resumed." correct? Why or why not?',answer:'No. It is a comma splice: two independent clauses joined by only a comma. Use a period, a semicolon, or ", and".'},minutes:4},{skillId:"rw.sec.form",title:"Agreement, tense, pronouns, and modifiers by rule",objective:"Choose verb forms, pronouns, and modifier placements that follow Standard English rules.",cues:["Choices are different forms of the same word","Verb tenses or pronouns vary across choices","A sentence starts with an introductory phrase and a comma"],steps:['Subject-verb agreement: cross out phrases between the subject and verb (especially "of..." phrases), then match the verb to the true subject.','Verb tense: match the time frame set by other verbs and time words ("in 1902," "currently").',`Pronouns: find the noun the pronoun replaces and match its number; "its" is possessive, "it's" means "it is."`,`Modifiers: the noun right after an introductory phrase must be the one the phrase describes; a possessive (like "Ana's") does not count.`],workedExample:{problem:'Text: "The box of old photographs found in the attic ______ dated pictures from the 1920s." Choices: contain / contains / have contained / are containing',solution:['Cross out "of old photographs found in the attic."','The true subject is "box," which is singular.',"Rule: a singular subject takes a singular verb.",'Answer: "contains".']},trap:"Matching the verb or pronoun to the nearest noun instead of to the word it actually goes with.",check:{question:`What is wrong with "Walking to school, the rain soaked Mia's backpack"?`,answer:'It is a dangling modifier: it says the rain was walking. Fix: "Walking to school, Mia got her backpack soaked by the rain."'},minutes:4}];var et=(e,t)=>({skillId:e,...t}),Yg=[et("math.alg.lin1",{title:"Solve linear equations step by step",objective:"Solve a one-variable linear equation and tell how many solutions it has.",cues:["One unknown with no exponents",'Words like "how many solutions"'],steps:["Distribute to every term in parentheses.","Combine like terms on each side.","Move x-terms to one side and numbers to the other.","Divide by the coefficient, then substitute back to check."],workedExample:{problem:"Solve 4(x + 2) \u2212 3 = x + 14.",solution:["4x + 8 \u2212 3 = x + 14","4x + 5 = x + 14","3x = 9, so x = 3","Check: 4(5) \u2212 3 = 17 and 3 + 14 = 17."]},trap:"If the x-terms cancel, do not stop: a true statement (like 5 = 5) means infinitely many solutions, and a false one (like 5 = 7) means none.",check:{question:"How many solutions does 2(x + 3) = 2x + 6 have?",answer:"Infinitely many; both sides simplify to 2x + 6."},minutes:3}),et("math.alg.linfn",{title:"Read slope and intercept",objective:"Interpret and use the slope and intercept of a linear function.",cues:["f(x) = mx + b","A table with a constant change",'"What does the number represent?"'],steps:["Find the slope: change in output \xF7 change in input.","Find the intercept: the output when the input is 0.",'Attach units: slope is "output units per input unit."','Use f(a) to mean "the output when x = a."'],workedExample:{problem:"A taxi charges T(m) = 2.5m + 4 dollars for m miles. What does 2.5 mean, and what is T(6)?",solution:["2.5 multiplies miles, so it is the cost per mile: $2.50.","T(6) = 2.5(6) + 4 = 19 dollars."]},trap:"The intercept is not the cost of the first unit: T(1) includes both the fixed fee and one unit of the rate.",check:{question:"If f(1) = 7 and f(4) = 16 for a linear f, what is the slope?",answer:"3, because (16 \u2212 7)/(4 \u2212 1) = 9/3."},minutes:3}),et("math.alg.lin2",{title:"Equations and graphs of lines",objective:"Write a two-variable linear equation from a situation and read slope from any form.",cues:["Two unknown quantities with a fixed total","Standard form Ax + By = C"],steps:["Name what each variable counts.","Write each term as (rate) \xD7 (variable) and set the sum equal to the total.","To find slope from Ax + By = C, solve for y.","Perpendicular slopes multiply to \u22121."],workedExample:{problem:"What is the slope of 2x \u2212 5y = 10?",solution:["\u22125y = \u22122x + 10","y = (2/5)x \u2212 2","Slope = 2/5."]},trap:"In Ax + By = C, the slope is \u2212A/B, not A; reading the x-coefficient as the slope is a common mistake.",check:{question:"What slope is perpendicular to a line with slope \u22122/3?",answer:"3/2."},minutes:3}),et("math.alg.systems",{title:"Solve systems of two equations",objective:"Solve a linear system and decide when it has zero, one, or infinitely many solutions.",cues:["Two equations, two unknowns",'"No solution" or "infinitely many solutions"'],steps:["If a variable has opposite coefficients, add the equations to eliminate it.","Otherwise, scale one equation or substitute.","Substitute back to find the other variable.","For solution counts, compare slopes and intercepts."],workedExample:{problem:"Solve x + 2y = 9 and x \u2212 y = 3.",solution:["Subtract: 3y = 6, so y = 2","x \u2212 2 = 3, so x = 5","Check: 5 + 4 = 9 \u2713."]},trap:"Same slope does not always mean no solution: if the intercepts also match, the lines are the same, with infinitely many solutions.",check:{question:"For what k do 2x + y = 5 and 4x + ky = 3 have no solution?",answer:"k = 2 (coefficients double, but 5 \xB7 2 = 10 \u2260 3)."},minutes:3}),et("math.alg.ineq",{title:"Solve and use linear inequalities",objective:'Solve inequalities and use them to answer "at most" or "at least" questions.',cues:['Words like "at most," "no more than," "at least"',"Symbols <, >, \u2264, \u2265"],steps:['Translate: "at most" is \u2264 and "at least" is \u2265.',"Solve like an equation.","Flip the sign when multiplying or dividing by a negative.","For whole objects, round in the direction that keeps the inequality true."],workedExample:{problem:"A ticket costs $12 and you have $100. What is the most tickets you can buy?",solution:["12t \u2264 100","t \u2264 8.33","Round down: 8 tickets (8 \xB7 12 = 96 \u2264 100)."]},trap:'Rounding to the nearest whole number can break the inequality: 8.6 boxes under "at most" still means 8, not 9.',check:{question:"Solve \u22122x \u2264 10.",answer:"x \u2265 \u22125."},minutes:3}),et("math.adv.equiv",{title:"Rewrite expressions correctly",objective:"Expand, factor, and use exponent rules to find equivalent expressions.",cues:['"Which expression is equivalent"',"Squares of binomials, fractional exponents, or radicals"],steps:["Expand every product fully; (a \u2212 b)\xB2 = a\xB2 \u2212 2ab + b\xB2.","Put a subtracted product in parentheses before distributing the minus sign.","Rewrite radicals as fractional exponents: \u221Ax = x^(1/2).","Add exponents when multiplying and subtract when dividing."],workedExample:{problem:"Simplify (x + 4)\xB2 \u2212 x(x + 3).",solution:["x\xB2 + 8x + 16 \u2212 (x\xB2 + 3x)","x\xB2 + 8x + 16 \u2212 x\xB2 \u2212 3x","5x + 16"]},trap:"One numeric substitution does not prove two expressions are equivalent; different expressions can agree at one value. Use algebra, or test at least two values to eliminate choices.",check:{question:"Write x\xB3 \xB7 \u221Ax as a single power of x.",answer:"x^(7/2)."},minutes:4}),et("math.adv.nleq",{title:"Solve quadratics and nonlinear systems",objective:"Solve quadratic equations and systems with a line and a curve.",cues:["x\xB2 terms set equal to 0","One equation is a line and one is a parabola"],steps:["Move everything to one side so it equals 0.","Divide out any common factor.","Factor, or use the quadratic formula.","For a system, set the y-expressions equal, solve for x, then find y."],workedExample:{problem:"Solve x\xB2 + 2x = 15.",solution:["x\xB2 + 2x \u2212 15 = 0","(x + 5)(x \u2212 3) = 0","x = \u22125 or x = 3"]},trap:"Do not divide both sides by x to simplify: it throws away the solution x = 0.",check:{question:"What is the product of the solutions of x\xB2 \u2212 7x + 12 = 0?",answer:"12 (solutions 3 and 4)."},minutes:4}),et("math.adv.nlfn",{title:"Quadratic and exponential functions",objective:"Read key features of quadratic and exponential functions and build exponential models.",cues:["Vertex form a(x \u2212 h)\xB2 + k","Growth or decay by a constant factor"],steps:["In a(x \u2212 h)\xB2 + k, the vertex is (h, k); a < 0 means a maximum.","In a \xB7 b^(t/k), a is the start, b the factor, k the time per factor.","b > 1 means growth; 0 < b < 1 means decay.","Make t and k use the same units."],workedExample:{problem:"A $500 investment grows 4% each year. Write the value after t years.",solution:["Factor per year: 1 + 0.04 = 1.04","V(t) = 500(1.04)^t"]},trap:"The vertex of (x + 2)\xB2 is at x = \u22122, not +2; the sign inside the parentheses flips.",check:{question:"Does y = 3(0.8)^x show growth or decay?",answer:"Decay, since 0.8 < 1."},minutes:3}),et("math.psda.ratios",{title:"Ratios, rates, and unit conversions",objective:"Solve proportions and convert rates between units.",cues:['"For every," "per," or "at this rate"',"Two different units in the question"],steps:["Write the ratio with the same quantity on top on both sides.","Cross-multiply to solve.","For conversions, multiply by fractions equal to 1 (like 1,000 m / 1 km).","Check that unwanted units cancel."],workedExample:{problem:"Convert 90 kilometers per hour to meters per second.",solution:["90 \xD7 1,000 = 90,000 m/h","90,000 \xF7 3,600 = 25 m/s"]},trap:"Adding the same amount to both parts of a ratio does not keep it the same; 2:3 is not equal to 4:5.",check:{question:"If 5 pens cost $3, what do 20 pens cost?",answer:"$12."},minutes:3}),et("math.psda.percent",{title:"Percents as multipliers",objective:"Use multipliers for percent of, percent change, and successive changes.",cues:['"Percent of," "increased by," "decreased by"',"Two changes in a row"],steps:["A percent of a number: multiply by the decimal.","An increase of r%: multiply by (1 + r/100); a decrease: (1 \u2212 r/100).","Successive changes: multiply the multipliers.","To find the original, divide by the total multiplier."],workedExample:{problem:"A price rises 10% and then falls 10%. What is the net change?",solution:["1.10 \xD7 0.90 = 0.99","A net 1% decrease."]},trap:"Percent changes do not add: +20% then \u221220% is a 4% decrease, not 0%.",check:{question:"After a 25% discount, a shirt costs $30. What was the original price?",answer:"$40 (30 \xF7 0.75)."},minutes:3}),et("math.psda.onevar",{title:"Center and spread of data",objective:"Find mean and median and predict how changes affect center and spread.",cues:["Frequency tables, dot plots, or lists",'"Mean," "median," "standard deviation," "range"'],steps:["Order the data; the median is the middle value (average the two middle ones for an even count).","Mean = sum \xF7 count; in a frequency table, multiply each value by its frequency.","Outliers pull the mean much more than the median.","Standard deviation measures typical distance from the mean."],workedExample:{problem:"Find the mean and median of 3, 4, 4, 5, 19.",solution:["Median: 4 (the 3rd value)","Mean: 35 \xF7 5 = 7","The outlier 19 pulls the mean above the median."]},trap:"In a frequency table, do not take the median of the frequency column; the data values are the first column.",check:{question:"If every value in a data set increases by 5, what happens to the standard deviation?",answer:"It stays the same."},minutes:3}),et("math.psda.twovar",{title:"Scatterplots and models",objective:"Use lines of best fit and choose linear or exponential models.",cues:["Line of best fit \u0177 = mx + b","A table to classify as linear or exponential"],steps:["Predict by substituting x into the line of best fit.","Residual = actual \u2212 predicted.","Constant differences \u2192 linear; constant ratios \u2192 exponential.","Interpret slope as the predicted change in y per unit of x."],workedExample:{problem:"\u0177 = 1.5x + 20. A point is (8, 29). Find the residual.",solution:["Predicted: 1.5(8) + 20 = 32","Residual: 29 \u2212 32 = \u22123 (point below the line)"]},trap:"Checking only the first two rows of a table can fit a wrong model; verify every row.",check:{question:"y-values 3, 6, 12, 24 for x = 0, 1, 2, 3: linear or exponential?",answer:"Exponential (ratio 2)."},minutes:3}),et("math.psda.prob",{title:"Probability and two-way tables",objective:"Find simple and conditional probabilities from counts and tables.",cues:['"At random"','"Given that" or "of those who\u2026"'],steps:["Probability = favorable \xF7 total.",'For "not A," use 1 \u2212 P(A).',"For conditional probability, the denominator is the total of the given group only.","Read the correct row or column of the table."],workedExample:{problem:"Of 40 students, 25 play a sport; 10 of those also play an instrument. P(instrument | sport)?",solution:["Given group: 25 sport players","P = 10/25 = 2/5"]},trap:'Using the grand total as the denominator on a "given" question gives the wrong probability.',check:{question:"A die is rolled. What is P(not 6)?",answer:"5/6."},minutes:3}),et("math.psda.inference",{title:"Samples and margin of error",objective:"Interpret a margin of error and decide how far a sample result generalizes.",cues:['"Random sample," "margin of error"','"Which conclusion is appropriate"'],steps:["Build the interval: estimate \xB1 margin of error.","The interval describes the population, not the sample.","Generalize only to the population that was randomly sampled.","Larger samples give smaller margins of error."],workedExample:{problem:"A random sample of a town's residents gives 62% \xB1 3%. What is plausible?",solution:["Interval: 59% to 65%","It is plausible that 59%\u201365% of all town residents agree."]},trap:"A margin of error never makes a claim certain, and it says nothing about people outside the sampled population.",check:{question:"Would quadrupling the sample size make the margin of error larger or smaller?",answer:"Smaller (about half as large)."},minutes:3}),et("math.psda.claims",{title:"Experiments vs. observational studies",objective:"Decide whether a study supports cause-and-effect or generalization.",cues:['"Randomly assigned" or "randomly selected"','"Which conclusion is supported"'],steps:["Random assignment to treatments \u2192 cause-and-effect is supported.","Random sampling from a population \u2192 generalize to that population.","No random assignment \u2192 association only.","Check both questions separately."],workedExample:{problem:"Volunteers are randomly assigned to two diets; diet A loses more weight. Conclusion?",solution:["Random assignment \u2192 diet A likely causes more weight loss","Volunteers \u2192 applies to people like these volunteers"]},trap:"A large random sample does not prove cause; only random assignment supports a causal claim.",check:{question:"A random survey finds readers sleep more. Can we say reading causes more sleep?",answer:"No; it is observational, so it shows only an association."},minutes:3}),et("math.geo.area",{title:"Area and volume",objective:"Use area and volume formulas, including when shapes change.",cues:["Perimeter, area, or volume in the question","Liquid poured from one container to another"],steps:["Write the formula first (A = \u2113w, V = \u03C0r\xB2h, and so on).","Express unknown sides with one variable.","Set up an equation from the given fact.","Answer with the quantity asked, in the right units."],workedExample:{problem:"A cylinder has radius 3 and volume 72\u03C0. Find its height.",solution:["\u03C0r\xB2h = 9\u03C0h","9\u03C0h = 72\u03C0, so h = 8"]},trap:"Scaling lengths by k scales area by k\xB2 and volume by k\xB3, not by k.",check:{question:"A square has perimeter 36. What is its area?",answer:"81."},minutes:3}),et("math.geo.lines",{title:"Angles and similar triangles",objective:"Use parallel-line angle facts, triangle sums, and similarity ratios.",cues:["Parallel lines cut by a transversal","A segment parallel to a triangle's side"],steps:["Angles in a triangle add to 180\xB0; a straight line is 180\xB0.","Parallel lines: alternate interior angles are equal; same-side interior angles add to 180\xB0.","Similar triangles have proportional matching sides.","Match sides of the whole triangles, not pieces."],workedExample:{problem:"In triangle ABC, DE \u2225 BC with D on AB, E on AC. AD = 4, AB = 12, BC = 15. Find DE.",solution:["Ratio AD/AB = 4/12 = 1/3","DE = 15/3 = 5"]},trap:"Using DB instead of the whole side AB in the ratio gives a wrong length.",check:{question:"Two angles of a triangle are 50\xB0 and 65\xB0. What is the third?",answer:"65\xB0."},minutes:3}),et("math.geo.trig",{title:"Right triangles and trig ratios",objective:"Use the Pythagorean theorem and sine, cosine, and tangent.",cues:["A right angle with two known sides","sin, cos, or tan of an angle"],steps:["a\xB2 + b\xB2 = c\xB2, where c is the hypotenuse.","SOH-CAH-TOA from the angle in question.","Label opposite and adjacent from that angle.","For the two acute angles, sin A = cos B."],workedExample:{problem:"A right triangle has legs 9 and 12. Find the hypotenuse and the sine of the angle opposite the 9 side.",solution:["c = \u221A(81 + 144) = 15","sin = 9/15 = 3/5"]},trap:"Opposite and adjacent switch when you switch angles: tan P and tan Q are reciprocals.",check:{question:"If cos A = 0.6 in a right triangle, what is sin of the other acute angle?",answer:"0.6."},minutes:3}),et("math.geo.circles",{title:"Circle equations, arcs, and sectors",objective:"Find the center and radius from an equation and compute arcs and sectors.",cues:["x\xB2 + y\xB2 terms with x and y terms","Central angles in degrees or radians"],steps:["Standard form: (x \u2212 h)\xB2 + (y \u2212 k)\xB2 = r\xB2; center (h, k).","If not in standard form, complete the square for x and y.","Arc length = r\u03B8 (radians) or (\u03B8/360)\xB72\u03C0r (degrees).","Sector area = (\u03B8/360)\xB7\u03C0r\xB2 in degrees."],workedExample:{problem:"Find the center and radius of x\xB2 + y\xB2 + 4x \u2212 2y = 4.",solution:["(x\xB2 + 4x + 4) + (y\xB2 \u2212 2y + 1) = 4 + 4 + 1","(x + 2)\xB2 + (y \u2212 1)\xB2 = 9","Center (\u22122, 1), radius 3"]},trap:"The number on the right of the standard form is r\xB2, not r; take its square root.",check:{question:"What is the arc length for a 90\xB0 central angle in a circle of radius 8?",answer:"4\u03C0."},minutes:4})];var Xt=[{id:"rw.ii",section:"rw",name:"Information and Ideas",share:.26},{id:"rw.cs",section:"rw",name:"Craft and Structure",share:.28},{id:"rw.eoi",section:"rw",name:"Expression of Ideas",share:.2},{id:"rw.sec",section:"rw",name:"Standard English Conventions",s
