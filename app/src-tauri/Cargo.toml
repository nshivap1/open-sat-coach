[package]
name = "open-sat-coach"
version = "0.1.0"
description = "Open SAT Coach desktop shell (offline SAT practice)"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "open_sat_coach_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# Loopback HTTP (net.rs, llama.rs; never redirected off loopback) and HTTPS model downloads
# from huggingface.co (models.rs). "tls" = rustls with bundled webpki roots; no gzip.
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
